name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# A push that supersedes an earlier one on the same branch cancels it. The cargo job
# clones a second repository and compiles the whole agent, so a stale run is expensive
# to leave finishing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # The Electron *package* is needed — `src/main` and `src/preload` are typed against
      # it. The 100MB Electron *binary* is not: nothing here launches a window. The
      # `drive:*` scripts do, and they want a macOS runner and a display, so they are not
      # part of this workflow.
      - name: Install
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

  cargo:
    name: Lint and test the bridge
    runs-on: ubuntu-latest
    steps:
      # Two checkouts, side by side, because `crates/bravebot-bridge/Cargo.toml` depends on
      # the agent by path (`../../../bravebot/crates/...`) against a sibling checkout.
      # `actions/checkout` will not write outside the workspace, so the sibling pair is made
      # inside it rather than by cloning the agent to `..`.
      - uses: actions/checkout@v4
        with:
          path: brave-bot-ui

      # No ref: this builds against the agent's `main`, which is what a developer's sibling
      # checkout usually is, so CI breaks when the agent breaks us rather than at the next
      # person's `npm run bridge`. The cost is that an upstream change can turn this
      # repository red without anything here having changed.
      - uses: actions/checkout@v4
        with:
          repository: brave-experiments/brave-user-agent
          path: bravebot

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: brave-bot-ui

      # No `--locked`. Cargo.lock here pins the agent's dependency tree as well as our own,
      # and the agent moves independently: the first upstream dependency bump would fail
      # every run in this repository for a reason no change here caused.
      #
      # `BRAVEBOT_ALLOW_UNCONFIGURED_BUILD=1` is not set here — `.cargo/config.toml` in this
      # repository already sets it, and these jobs compile and test rather than producing a
      # binary anyone runs against the backend.
      - name: Clippy
        working-directory: brave-bot-ui
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        working-directory: brave-bot-ui
        run: cargo test --all

      # Deliberately no `cargo fmt --all -- --check`, which the agent's own CI does run. The
      # bridge crate is not rustfmt-clean: rustfmt would rewrite around 490 lines, mostly
      # breaking method chains and `assert!` calls that are on one line on purpose. Adding
      # the check means reformatting the crate first, which is a change to make on its own
      # and not as a side effect of turning CI on.

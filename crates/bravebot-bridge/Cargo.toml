[package]
name = "bravebot-bridge"
description = "Drives bravebot for a graphical front-end"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# bravebot is depended on, never modified. See docs/phase-0-rpc-protocol.md §2.
#
# Paths into `vendor/bravebot`, which is a git submodule and therefore a pinned revision:
# the path says where the sources are, the submodule says which ones. These crates carry no
# compatibility promise, so the pin is load-bearing — upstream adds a field to a struct the
# bridge builds and this stops compiling. Moving the pin is `git -C vendor/bravebot fetch &&
# git -C vendor/bravebot checkout <rev>`, then a test pass, then commit the new gitlink.
[dependencies]
bravebot-agent = { path = "../../vendor/bravebot/crates/agent" }
# For `Message` and `Role`: cutting a conversation has to look at what a message *is*, and
# `Snapshot::messages` is a `Vec<Message>` from this crate. Reading the type the agent already
# hands us is not a widening of what this depends on.
bravebot-aichat = { path = "../../vendor/bravebot/crates/aichat" }
bravebot-config = { path = "../../vendor/bravebot/crates/config" }
bravebot-net = { path = "../../vendor/bravebot/crates/net" }
bravebot-core = { path = "../../vendor/bravebot/crates/core" }
# For `sessions` (the on-disk record), `store` (~/.bravebot), and `audit::as_json`. All three
# are `pub`. This drags ratatui in for a binary that draws nothing, which costs a few
# seconds of compile time and some dead code the linker discards. The alternative was
# extracting them upstream, which is a refactor of a repository we do not own.
bravebot-tui = { path = "../../vendor/bravebot/crates/tui" }
serde = { workspace = true }
serde_json = { workspace = true }
